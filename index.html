
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <meta name="description" content="NEXUS V5 - Your personal browser desktop">
  <title>NEXUS V5</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="boot-screen">
    <div class="boot-logo">N</div>
    <h1>NEXUS</h1>
    <p>INITIALIZING DESKTOP</p>
    <div class="boot-track"><span></span></div>
  </div>

  <main id="desktop" class="hidden">
    <div id="desktop-wallpaper"></div>

    <header class="top-bar">
      <div class="brand"><span class="brand-mark">N</span> NEXUS</div>
      <div id="top-clock">--:--</div>
      <button id="power-button" title="Power">⏻</button>
    </header>

    <section id="desktop-icons" class="desktop-icons">
      <button class="desktop-icon" data-open="browser">
        <span>🌐</span><small>Browser</small>
      </button>
      <button class="desktop-icon" data-open="files">
        <span>📁</span><small>Files</small>
      </button>
      <button class="desktop-icon" data-open="downloads">
        <span>⬇️</span><small>Downloads</small>
      </button>
      <button class="desktop-icon" data-open="settings">
        <span>⚙️</span><small>Settings</small>
      </button>
      <button class="desktop-icon" data-open="ai">
        <span>✦</span><small>NEXUS AI</small>
      </button>
    </section>

    <section id="window-layer"></section>

    <div id="start-menu" class="start-menu hidden">
      <input id="start-search" placeholder="Search apps and the web..." autocomplete="off">
      <div class="start-apps">
        <button data-open="browser">🌐 Browser</button>
        <button data-open="files">📁 File Explorer</button>
        <button data-open="downloads">⬇️ Downloads</button>
        <button data-open="settings">⚙️ Settings</button>
        <button data-open="ai">✦ NEXUS AI</button>
      </div>
    </div>

    <nav class="taskbar">
      <button id="start-button" class="taskbar-start" title="Start">✦</button>
      <button data-open="browser" title="Browser">🌐</button>
      <button data-open="files" title="Files">📁</button>
      <button data-open="downloads" title="Downloads">⬇️</button>
      <button data-open="settings" title="Settings">⚙️</button>
      <div class="taskbar-spacer"></div>
      <div id="taskbar-clock">--:--</div>
    </nav>
  </main>

  <div id="toast-area" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
