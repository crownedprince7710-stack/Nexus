
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b13">
  <meta name="description" content="PROJECT NEXUS - Your personal web desktop">
  <title>NEXUS — Your Digital Space</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Welcome screen -->
  <section id="welcomeScreen" class="welcome-screen">
    <div class="welcome-glow"></div>
    <div class="welcome-content">
      <div class="nexus-mark">N</div>
      <p class="eyebrow">YOUR PERSONAL DIGITAL SPACE</p>
      <h1>NEXUS<span>.</span></h1>
      <p class="welcome-subtitle">One space. Endless possibilities.</p>
      <button id="enterButton" class="primary-button">ENTER NEXUS <span>→</span></button>
      <p class="version">NEXUS WEB DESKTOP · VERSION 1.0</p>
    </div>
  </section>

  <!-- Desktop -->
  <main id="desktop" class="desktop hidden">
    <div class="desktop-wallpaper"></div>

    <header class="desktop-header">
      <div class="desktop-brand"><span class="brand-symbol">N</span> NEXUS</div>
      <div id="desktopDate" class="desktop-date"></div>
    </header>

    <section id="desktopIcons" class="desktop-icons">
      <button class="desktop-icon" data-app="explorer">
        <span class="app-icon">📁</span><span>File Explorer</span>
      </button>
      <button class="desktop-icon" data-app="notes">
        <span class="app-icon">📝</span><span>Notes</span>
      </button>
      <button class="desktop-icon" data-app="calculator">
        <span class="app-icon">🧮</span><span>Calculator</span>
      </button>
      <button class="desktop-icon" data-app="browser">
        <span class="app-icon">🌐</span><span>Browser</span>
      </button>
      <button class="desktop-icon" data-app="settings">
        <span class="app-icon">⚙️</span><span>Settings</span>
      </button>
      <button class="desktop-icon" data-app="library">
        <span class="app-icon">▦</span><span>App Library</span>
      </button>
    </section>

    <div id="windowArea" class="window-area"></div>

    <!-- Start menu -->
    <section id="startMenu" class="start-menu hidden">
      <div class="start-top">
        <div class="start-avatar">N</div>
        <div><strong>NEXUS USER</strong><small>Your workspace</small></div>
      </div>
      <div class="start-search">
        <input id="startSearch" placeholder="Search apps..." autocomplete="off">
      </div>
      <p class="menu-heading">PINNED APPLICATIONS</p>
      <div id="startApps" class="start-apps"></div>
      <div class="start-bottom">
        <span>NEXUS DESKTOP 1.0</span>
        <button id="restartButton" title="Return to welcome screen">↻</button>
      </div>
    </section>

    <!-- Control centre -->
    <section id="controlPanel" class="control-panel hidden">
      <div class="control-heading">
        <strong>CONTROL CENTRE</strong>
        <button id="closeControl">✕</button>
      </div>
      <div class="control-card">
        <span>◈</span><div><strong>NEXUS SYSTEM</strong><small>Browser desktop active</small></div>
      </div>
      <div class="control-grid">
        <button id="controlSettings">⚙️<span>Settings</span></button>
        <button id="controlExplorer">📁<span>My Files</span></button>
        <button id="controlNotes">📝<span>Notes</span></button>
        <button id="backupButton">⬇️<span>Backup</span></button>
      </div>
      <p class="control-foot">Your workspace is stored in this browser.</p>
    </section>

    <!-- Desktop context menu -->
    <div id="contextMenu" class="context-menu hidden">
      <button data-action="refresh">↻ Refresh desktop</button>
      <button data-action="notes">＋ New note</button>
      <button data-action="settings">⚙ Personalise</button>
      <button data-action="explorer">📁 Open NEXUS Drive</button>
    </div>

    <!-- Taskbar -->
    <footer class="taskbar">
      <button id="startButton" class="task-start" title="Start menu">
        <span class="task-logo">N</span>
      </button>
      <div id="taskApps" class="task-apps"></div>
      <div class="task-right">
        <button id="controlButton" class="tray-button" title="Control centre">⌃</button>
        <div class="tray-clock">
          <strong id="taskClock">00:00</strong>
          <small id="taskDate"></small>
        </div>
      </div>
    </footer>
  </main>

  <input type="file" id="restoreInput" accept="application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
